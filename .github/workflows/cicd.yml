name: Code Analysis and Deploy

on:
  push:
    branches:
      - "4.x"
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm
        run: npm install -g npm

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (JavaScript)
        run: npx eslint "js/**/*.js"

      - name: Run stylelint (CSS)
        run: npx stylelint "css/**/*.css"

      - name: Run HTMLHint (HTML)
        run: npx htmlhint "**/*.html"

      - name: Run check circular dependency
        run: npx madge --circular js

      - name: Run build
        run: npm run build

  deploy:
    needs: quality-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check Netlify credentials
        id: netlify-auth
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Netlify credentials are not configured; deployment steps will be skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.netlify-auth.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.netlify-auth.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm
        if: steps.netlify-auth.outputs.configured == 'true'
        run: npm install -g npm

      - name: Install Netlify CLI
        if: steps.netlify-auth.outputs.configured == 'true'
        run: npm install && npm install -g netlify-cli

      - name: Run Build
        if: steps.netlify-auth.outputs.configured == 'true'
        run: npm run build

      - name: Add netlify.toml File for Headers
        if: steps.netlify-auth.outputs.configured == 'true'
        run: |
          echo "[[headers]]" > netlify.toml
          echo "  for = \"/*\"" >> netlify.toml
          echo "  [headers.values]" >> netlify.toml
          echo "    Access-Control-Allow-Origin = \"*\"" >> netlify.toml
          echo "    Access-Control-Allow-Headers = \"*\"" >> netlify.toml
          echo "    Access-Control-Allow-Methods = \"*\"" >> netlify.toml
          echo "    Access-Control-Expose-Headers = \"*\"" >> netlify.toml

      - name: Deploy to Netlify
        if: steps.netlify-auth.outputs.configured == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --telemetry-disable --dir=. --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
